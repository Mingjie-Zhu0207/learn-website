{% extends 'base.html' %}{% block title %}登录{% endblock %}
{% block content %}<section class="auth-layout"><aside class="auth-art"><span class="eyebrow">A CLEARER WAY FORWARD</span><h1>让每一次<br>提交都被看见</h1><p>在这里发布任务、提交作业，记录每一步进步。</p><div class="art-orb"></div></aside><div class="auth-card"><span class="kicker">CHENGYU · CLASSROOM</span><h2>欢迎回来</h2><p class="muted">登录你的账号，继续学习。</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>用户名<input name="username" autocomplete="username" required autofocus placeholder="请输入用户名"></label><label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label><button class="button primary wide">登录</button></form><p class="auth-bottom">还没有账号？<a href="{{ url_for('register') }}">创建学生账号</a></p></div></section>{% endblock %}

{% extends 'base.html' %}{% block title %}修改密码{% endblock %}
{% block content %}<section class="form-panel auth-password"><span class="kicker">ACCOUNT SECURITY</span><h1>请先修改密码</h1><p class="muted">这是教师临时密码。设置新密码后才能继续使用工作台。</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>新密码<input name="password" type="password" minlength="12" required autocomplete="new-password" placeholder="至少 12 个字符"></label><label>再次输入新密码<input name="confirm_password" type="password" minlength="12" required autocomplete="new-password" placeholder="确认新密码"></label><button class="button primary">保存新密码</button></form></section>{% endblock %}

{% extends 'base.html' %}{% block title %}注册{% endblock %}
{% block content %}<section class="auth-layout"><aside class="auth-art"><span class="eyebrow">YOUR LEARNING JOURNEY</span><h1>从一次提交<br>开始成长</h1><p>创建账号，加入作业空间，和老师一起跟进学习进度。</p><div class="art-orb"></div></aside><div class="auth-card"><span class="kicker">CHENGYU · CLASSROOM</span><h2>创建账号</h2><p class="muted">学生可直接注册。教师填写邀请口令开通教师账号。</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>姓名<input name="display_name" maxlength="60" required autocomplete="name" placeholder="例如：林同学"></label><label>用户名<input name="username" minlength="3" maxlength="40" required autocomplete="username" placeholder="3–40 位字母、数字或 _ -"></label><label>密码<input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="至少 8 个字符"></label><label>教师邀请口令 <span class="optional">（学生留空）</span><input name="teacher_code" type="password" autocomplete="off" placeholder="仅教师填写"></label><button class="button primary wide">注册并进入</button></form><p class="auth-bottom">已有账号？<a href="{{ url_for('login') }}">返回登录</a></p></div></section>{% endblock %}

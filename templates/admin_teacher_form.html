{% extends 'base.html' %}{% block title %}{{ '编辑教师' if teacher else '创建教师' }}{% endblock %}
{% block content %}<a class="back-link" href="{{ url_for('admin_teachers') }}">← 返回教师管理</a><section class="form-panel admin-form"><span class="kicker">TEACHER ACCOUNT</span><h1>{{ '编辑教师资料' if teacher else '创建教师账号' }}</h1>{% if not teacher %}<p class="muted">系统会生成随机临时密码，教师首次登录时必须修改。</p>{% endif %}<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% if not teacher %}<label>用户名<input name="username" minlength="3" maxlength="40" required placeholder="3–40 位字母、数字或 _ -"></label>{% else %}<label>用户名<input value="{{ teacher['username'] }}" disabled></label>{% endif %}<label>姓名<input name="display_name" maxlength="60" required value="{{ teacher['display_name'] if teacher else '' }}"></label><label>手机号 <span class="optional">（可选）</span><input name="phone" type="tel" value="{{ teacher['phone'] if teacher and teacher['phone'] else '' }}"></label><button class="button primary">{{ '保存资料' if teacher else '创建账号' }}</button></form></section>{% endblock %}

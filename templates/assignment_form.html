{% extends 'base.html' %}{% block title %}发布作业{% endblock %}
{% block content %}<a class="back-link" href="{{ url_for('home') }}">← 返回作业列表</a><section class="form-panel"><span class="kicker">NEW ASSIGNMENT</span><h1>发布作业</h1><p class="muted">填写任务内容和截止时间，发布后学生即可查看。</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>作业标题<input name="title" maxlength="120" required placeholder="例如：第三章练习题"></label><label>作业说明<textarea name="description" rows="6" maxlength="5000" placeholder="写清楚提交要求、格式和注意事项"></textarea></label><label>截止时间 <span class="optional">（可选）</span><input name="due_at" type="datetime-local"></label><div class="form-actions"><a class="button secondary" href="{{ url_for('home') }}">取消</a><button class="button primary">发布作业</button></div></form></section>{% endblock %}

{% extends 'base.html' %}{% block title %}教师临时密码{% endblock %}
{% block content %}<section class="form-panel temporary-password"><span class="kicker">ONE-TIME CREDENTIAL</span><h1>教师账号已创建</h1><p class="muted">请将以下临时密码安全地交给 {{ username }}。离开此页后无法再次查看。</p><div class="credential"><span>用户名</span><strong>{{ username }}</strong><span>临时密码</span><strong class="password-value">{{ temporary_password }}</strong></div><p class="flash error">请勿截图或转发到公开群聊。教师首次登录后必须修改密码。</p><a class="button primary" href="{{ url_for('admin_teachers') }}">返回教师管理</a></section>{% endblock %}
